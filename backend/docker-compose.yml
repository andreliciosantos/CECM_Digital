version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: secretaria_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - secretaria_network

volumes:
  postgres_data:

networks:
  secretaria_network: